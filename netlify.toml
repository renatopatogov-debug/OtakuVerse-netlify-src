# OtakuVerse no Netlify — site de teste
# O plugin oficial @netlify/plugin-nextjs converte as 27 API routes
# em Netlify Functions automaticamente; o resto vira estático (PWA).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# O Netlify instala o plugin oficial automaticamente ao detectar
# a declaração abaixo (não precisa adicionar no package.json).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Bundler de funções: esbuild é o padrão e o mais rápido.
[functions]
  node_bundler = "esbuild"

# APIs: nunca prender no CDN do Netlify (evita colisão de Durable Cache)
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/api/img"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"

# Headers do PWA (service worker sempre atualizado, manifest correto)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Redirecionamentos de conveniência para o Arcade integrado
[[redirects]]
  from = "/arcade/p2p"
  to = "/arcade/P2P/"
  status = 301

[[redirects]]
  from = "/arcade/p2p/*"
  to = "/arcade/P2P/:splat"
  status = 301

[[redirects]]
  from = "/arcade/games/*"
  to = "/arcade/GAMES/:splat"
  status = 301

[[redirects]]
  from = "/arcade/ghostchat/*"
  to = "/arcade/GHOSTCHAT/:splat"
  status = 301

[[redirects]]
  from = "/arcade/acervogames/*"
  to = "/arcade/ACERVOGAMES/:splat"
  status = 301

[[redirects]]
  from = "/arcade/testeimagem/*"
  to = "/arcade/TESTEIMAGEM/:splat"
  status = 301
