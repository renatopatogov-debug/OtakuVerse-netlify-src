# OtakuVerse no Netlify — site de teste
# O plugin oficial @netlify/plugin-nextjs converte as 29 API routes
# em Netlify Functions automaticamente; o resto vira estático (PWA).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# O Netlify instala o plugin oficial automaticamente ao detectar
# a declaração abaixo (não precisa adicionar no package.json).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Bundler de funções: esbuild é o padrão e o mais rápido.
[functions]
  node_bundler = "esbuild"

# APIs dinâmicas (JSON / streams): nunca prender no CDN do Netlify.
# Escopado por rota para NÃO sobrescrever os headers dinâmicos de cache das capas e páginas de mangá.
[[headers]]
  for = "/api/anilist/*"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/api/anime/*"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/api/hls"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"
    Netlify-Vary = "query=u"

[[headers]]
  for = "/api/img"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"
    Netlify-Vary = "query=u"

[[headers]]
  for = "/api/skip-times"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/api/manga/chapters"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/api/manga/detail"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/api/manga/pages"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/api/manga/popular"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/api/manga/recommendations"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/api/manga/search"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
    CDN-Cache-Control = "no-store"

# Capas e páginas de mangá: chave de variação isolada por query; o TTL (7 dias vs no-store em erro/SVG)
# vem diretamente da resposta da Function para nunca cachear placeholders ou falhas transitórias.
[[headers]]
  for = "/api/manga/cover/*"
  [headers.values]
    Netlify-Vary = "query=title|al"

[[headers]]
  for = "/api/manga/page/*"
  [headers.values]
    Netlify-Vary = "query=b"

[[headers]]
  for = "/api/anime/sfhd-sub"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Netlify-CDN-Cache-Control = "public, max-age=3600"
    CDN-Cache-Control = "public, max-age=3600"
    Netlify-Vary = "query=episodeId"

# Headers do PWA (service worker sempre atualizado, manifest correto)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Redirecionamentos de conveniência para o Arcade integrado
[[redirects]]
  from = "/arcade/p2p"
  to = "/arcade/P2P/"
  status = 301

[[redirects]]
  from = "/arcade/p2p/*"
  to = "/arcade/P2P/:splat"
  status = 301

[[redirects]]
  from = "/arcade/games/*"
  to = "/arcade/GAMES/:splat"
  status = 301

[[redirects]]
  from = "/arcade/ghostchat/*"
  to = "/arcade/GHOSTCHAT/:splat"
  status = 301

[[redirects]]
  from = "/arcade/acervogames/*"
  to = "/arcade/ACERVOGAMES/:splat"
  status = 301

[[redirects]]
  from = "/arcade/testeimagem/*"
  to = "/arcade/TESTEIMAGEM/:splat"
  status = 301
