<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pure P2P Share — Acervo Digital</title>
    <meta name="description" content="Transferência direta de arquivos entre navegadores via WebRTC ponto a ponto, sem intermediários.">
    <meta name="theme-color" content="#0f0f12">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #0f0f12;
            --card: #1a1a1e;
            --card-secondary: #25252b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #00adb5;
            --primary-hover: #00767a;
            --success: #10b981;
            --border: #333339;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 16px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100%;
            min-height: 100dvh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            background-color: var(--card);
            padding: 2.2rem 1.8rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 440px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden { display: none !important; }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(45deg, #00adb5, #00d2dc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-sub {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.85rem 1.4rem;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 14px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #059669; }

        .btn-danger {
            background-color: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover {
            background-color: var(--danger);
            color: white;
        }

        .dropzone { 
            border: 2px dashed var(--border);
            padding: 2.8rem 1.5rem;
            border-radius: var(--radius);
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
        }

        .dropzone:hover, .dropzone.dragover {
            background-color: rgba(0, 173, 181, 0.08);
            border-color: var(--primary);
        }

        .dropzone-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
        }

        .qr-container {
            display: inline-block;
            margin: 15px 0;
            background: white;
            padding: 12px;
            border-radius: var(--radius-sm);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .progress-box {
            text-align: left;
            margin-top: 15px;
        }

        .progress-bar {
            width: 100%;
            background-color: var(--card-secondary);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin: 12px 0;
            border: 1px solid var(--border);
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: var(--primary);
            transition: width 0.15s linear;
        }

        .progress-fill.connecting {
            background-color: var(--warning);
            width: 100%;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .link-box {
            background: var(--card-secondary);
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            font-size: 0.8rem;
            word-break: break-all;
            color: #cbd5e1;
            font-family: monospace;
            user-select: all;
            margin-bottom: 10px;
        }

        .status-msg {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 500;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .back-hub {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
            color: #e5e7eb;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.22);
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(15, 15, 18, 0.8);
            backdrop-filter: blur(6px);
            opacity: 0.7;
            transition: all 0.2s ease;
        }

        .back-hub:hover {
            opacity: 1;
            border-color: var(--primary);
            color: #fff;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .container {
                padding: 1.8rem 1.2rem;
                border-radius: 14px;
            }
            .header-title { font-size: 1.3rem; }
            .back-hub {
                top: 12px;
                left: 12px;
                padding: 6px 11px;
                font-size: 10px;
            }
            .qr-container { padding: 10px; }
            .dropzone { padding: 2.2rem 1rem; }
        }
    </style>
</head>
<body>

<a href="/?v=arcade" class="back-hub">← Arcade</a>

<div class="container">
    <h2 class="header-title">Pure P2P Share ⚡</h2>
    <p class="header-sub">Transferência direta entre dispositivos via WebRTC</p>
    
    <!-- Tela 1: Escolha do Arquivo (Remetente) -->
    <div id="viewSelection">
        <div class="dropzone" id="dropzone">
            <span class="dropzone-icon">📤</span>
            <p style="margin: 0; font-weight: 600;">Clique ou arraste um arquivo</p>
            <p style="margin: 6px 0 0 0; font-size: 0.8rem; color: var(--text-muted);">
                Transmissão direta P2P. Sem armazenamento em nuvem.
            </p>
            <input type="file" id="fileInput" style="display:none;">
        </div>
    </div>

    <!-- Tela 2: Status / Compartilhamento de Sala -->
    <div id="viewStatus" class="hidden">
        <div id="boxShare">
            <p style="font-size:0.85rem; color:#e2e8f0; margin-bottom: 8px; font-weight: 500;">
                Aponte a câmera do celular ou copie o link:
            </p>
            <div style="text-align: center;"><div id="shareQr" class="qr-container"></div></div>
            <div id="shareLink" class="link-box">Gerando sala segura...</div>
            <button class="btn" id="btnCopyLink" style="background-color: var(--card-secondary); border: 1px solid var(--border);">
                Copiar Link
            </button>
            <hr style="border: 0; height: 1px; background: var(--border); margin: 20px 0;">
        </div>

        <div class="progress-box">
            <h3 id="progressTitle" style="margin: 0 0 5px 0; font-size: 1.05rem;">Aguardando Conexão...</h3>
            <div id="fileMeta" style="font-size: 0.85rem; color: var(--primary); display:none; margin-bottom: 5px; font-weight: 600;"></div>
            
            <div class="progress-bar"><div class="progress-fill connecting" id="progressBar"></div></div>
            <div id="statusLabel" class="status-msg">Conectando à rede de sinalização...</div>
            
            <button id="acceptBtn" class="btn btn-success hidden">Aceitar e Salvar Arquivo</button>
            <button id="downloadBtn" class="btn btn-success hidden">Salvar Arquivo</button>
            <button class="btn btn-danger" id="btnCancel">Cancelar Operação</button>
        </div>
    </div>
</div>

<script>
    // Configuração de Sinalização usando Firebase Realtime Database
    const FIREBASE_CONFIG = {
        apiKey: "AIzaSyCZirWDZ2m55pnIOItpL8NkqJqlwntI1C0",
        authDomain: "ghostapp-b5dfc.firebaseapp.com",
        databaseURL: "https://ghostapp-b5dfc-default-rtdb.firebaseio.com",
        projectId: "ghostapp-b5dfc"
    };

    const CHUNK_SIZE = 32 * 1024; // 32KB seguro para dados WebRTC
    const MAX_RAM_AUTO_BYTES = 500 * 1024 * 1024; // 500MB limite para auto-download em RAM

    const rtcConfig = { 
        iceCandidatePoolSize: 4,
        iceServers: [
            { urls: [
                'stun:stun.l.google.com:19302',
                'stun:stun1.l.google.com:19302',
                'stun:stun2.l.google.com:19302',
                'stun:stun3.l.google.com:19302'
            ]}
            // Opcional: adicione seu servidor TURN aqui para redes 4G/5G ou NAT simétrico:
            // ,{ urls: 'turn:seu-turn.exemplo.com:3478', username: '...', credential: '...' }
        ]
    };

    let db = null, roomRef = null;
    let peerConnection, dataChannel;
    let selectedFile, role, roomId;
    let receivedChunks = [], receivedSize = 0, metaData = null;
    let fileWritableStream = null, isAborted = false;
    let handshakeStarted = false, transferenciaConcluida = false, eofRecebido = false;
    let signalWatchdog = null, iceDisconnectTimer = null;
    let pendingCandidates = [];
    let writeQueue = Promise.resolve();
    let metaAckSent = false;
    let peerIdConnected = null;
    let transferStartTime = 0;
    let activeDownloadUrl = null;

    function formatBytes(bytes) {
        if (!bytes || bytes <= 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
        const val = bytes / Math.pow(1024, i);
        return `${val.toFixed(i === 0 ? 0 : (i >= 2 ? 2 : 1))} ${units[i]}`;
    }

    function generateSecureId(prefix = '', bytesLen = 8) {
        if (window.crypto && window.crypto.getRandomValues) {
            const arr = new Uint8Array(bytesLen);
            window.crypto.getRandomValues(arr);
            const token = Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
            return prefix + token;
        }
        return prefix + Math.random().toString(36).substring(2, 12);
    }

    function isValidRoomId(id) {
        return typeof id === 'string' && /^[a-zA-Z0-9_-]{6,48}$/.test(id);
    }

    function sanitizeFileName(name) {
        if (typeof name !== 'string') return 'arquivo_recebido';
        const base = name.split(/[\\/]/).pop().replace(/[\x00-\x1f\x7f]/g, '').trim();
        if (!base || base === '.' || base === '..') return 'arquivo_recebido';
        return base.slice(0, 200);
    }

    const myClientId = generateSecureId('cli_', 6);
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');

    document.addEventListener('DOMContentLoaded', () => {
        try {
            if (typeof firebase === 'undefined') {
                falhaCritica("Serviço de sinalização indisponível. Verifique sua conexão.");
                return;
            }
            firebase.initializeApp(FIREBASE_CONFIG);
            db = firebase.database();
            
            if (roomParam !== null) {
                role = "receiver";
                document.getElementById('viewSelection').classList.add('hidden');
                document.getElementById('viewStatus').classList.remove('hidden');
                document.getElementById('boxShare').classList.add('hidden');
                if (!isValidRoomId(roomParam)) {
                    falhaCritica("Link de sala inválido ou corrompido.");
                    return;
                }
                roomId = roomParam;
                document.getElementById('progressTitle').innerText = "Preparando Recepção...";
                document.getElementById('statusLabel').innerText = "Conectando ao remetente...";
                inicializarP2P();
            } else {
                role = "sender";
                configurarPainelEnvio();
            }
        } catch(e) {
            console.error(e);
            falhaCritica("Falha ao inicializar serviço de rede.");
        }
    });

    function configurarPainelEnvio() {
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');

        dropzone.onclick = () => fileInput.click();
        dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('dragover'); };
        dropzone.ondragleave = () => { dropzone.classList.remove('dragover'); };
        dropzone.ondrop = (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) prepararEnvio(e.dataTransfer.files[0]);
        };
        fileInput.onchange = () => {
            if (fileInput.files.length) prepararEnvio(fileInput.files[0]);
        };
    }

    function prepararEnvio(file) {
        selectedFile = file;
        roomId = generateSecureId('room_', 8);
        
        document.getElementById('viewSelection').classList.add('hidden');
        document.getElementById('viewStatus').classList.remove('hidden');
        document.getElementById('fileMeta').style.display = "block";
        document.getElementById('fileMeta').innerText = `${file.name} (${formatBytes(file.size)})`;
        
        const linkCompleto = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
        document.getElementById('shareLink').innerText = linkCompleto;
        
        const qrEl = document.getElementById("shareQr");
        qrEl.innerHTML = '';
        if (typeof QRCode !== 'undefined') {
            qrEl.parentElement.style.display = 'block';
            new QRCode(qrEl, { 
                text: linkCompleto, 
                width: 150, 
                height: 150, 
                colorDark: "#0f0f12", 
                colorLight: "#ffffff" 
            });
        } else {
            qrEl.parentElement.style.display = 'none';
        }
        
        document.getElementById('btnCopyLink').onclick = async () => {
            let copied = false;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(linkCompleto);
                    copied = true;
                } catch(e) {}
            }
            if (!copied) {
                const temp = document.createElement("textarea");
                temp.value = linkCompleto;
                temp.style.position = "fixed";
                temp.style.opacity = "0";
                document.body.appendChild(temp);
                temp.select();
                try { copied = document.execCommand("copy"); } catch(e) {}
                document.body.removeChild(temp);
            }
            const btn = document.getElementById('btnCopyLink');
            const orig = btn.innerText;
            if (copied) {
                btn.innerText = "Link Copiado!";
                btn.style.backgroundColor = "var(--success)";
            } else {
                btn.innerText = "Selecione e copie o link acima";
                btn.style.backgroundColor = "var(--warning)";
            }
            setTimeout(() => {
                btn.innerText = orig;
                btn.style.backgroundColor = "var(--card-secondary)";
            }, 2000);
        };

        inicializarP2P();
    }

    function limparSalaFirebase() {
        if (roomRef) {
            try { roomRef.off(); } catch(e){}
            roomRef = null;
        }
        if (db && roomId) {
            db.ref(`p2p_rooms/${roomId}`).remove().catch(()=>{});
        }
    }

    function inicializarP2P() {
        if (!db) return;
        roomRef = db.ref(`p2p_rooms/${roomId}`);
        if (role === "sender") {
            try { roomRef.onDisconnect().remove(); } catch(e){}
        }

        configurarWebRTC();

        // Limite de espera para o par entrar
        signalWatchdog = setTimeout(() => {
            if (!isAborted && !handshakeStarted && (!dataChannel || dataChannel.readyState !== 'open')) {
                document.getElementById('statusLabel').innerText = "Aguardando o outro dispositivo abrir o link...";
            }
        }, 8000);

        // Notifica que o destinatário está online
        if (role === "receiver") {
            enviarSinal({ action: "client_ready" });
        }

        // Escuta os sinais de sinalização na sala
        roomRef.on('child_added', async (snap) => {
            const msg = snap.val();
            if (!msg || msg.senderId === myClientId || isAborted) return;

            // Trava a sala ao primeiro par conectado para evitar interferência de terceiros
            if (peerIdConnected && msg.senderId !== peerIdConnected) return;

            // Remove o sinal após o consumo
            snap.ref.remove().catch(() => {});

            if (msg.action === "client_ready" && role === "sender") {
                if (!handshakeStarted) {
                    peerIdConnected = msg.senderId;
                    handshakeStarted = true;
                    clearTimeout(signalWatchdog);
                    iniciarHandshake();
                }
            } else if (msg.sdp) {
                try {
                    if (!peerIdConnected) peerIdConnected = msg.senderId;
                    if (msg.sdp.type === 'offer') {
                        clearTimeout(signalWatchdog);
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                        await flushPendingCandidates();
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        enviarSinal({ sdp: peerConnection.localDescription });
                    } else if (msg.sdp.type === 'answer') {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                        await flushPendingCandidates();
                    }
                } catch (e) {
                    falhaCritica("Falha na negociação SDP da conexão P2P.");
                }
            } else if (msg.candidate) {
                if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate));
                    } catch(e) {}
                } else {
                    pendingCandidates.push(msg.candidate);
                }
            }
        });
    }

    async function flushPendingCandidates() {
        while (pendingCandidates.length > 0 && peerConnection) {
            const cand = pendingCandidates.shift();
            try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
            } catch(e) {}
        }
    }

    function sendChannelData(payload) {
        if (!dataChannel || dataChannel.readyState !== 'open') {
            throw new Error("Canal de dados fechado.");
        }
        dataChannel.send(payload);
    }

    function configurarWebRTC() {
        peerConnection = new RTCPeerConnection(rtcConfig);

        peerConnection.onicecandidate = (e) => {
            if (e.candidate) enviarSinal({ candidate: e.candidate });
        };

        peerConnection.oniceconnectionstatechange = () => {
            const state = peerConnection.iceConnectionState;
            if (state === "connected" || state === "completed") {
                clearTimeout(iceDisconnectTimer);
                document.getElementById('progressBar').classList.remove('connecting');
                document.getElementById('statusLabel').style.color = "var(--success)";
                if (role === "sender") document.getElementById('boxShare').classList.add('hidden');
            } else if (state === "disconnected") {
                if (!isAborted && !transferenciaConcluida && !eofRecebido) {
                    document.getElementById('statusLabel').style.color = "var(--warning)";
                    document.getElementById('statusLabel').innerText = "Conexão instável, tentando reconectar...";
                    clearTimeout(iceDisconnectTimer);
                    iceDisconnectTimer = setTimeout(() => {
                        if (!isAborted && !transferenciaConcluida && !eofRecebido && peerConnection && peerConnection.iceConnectionState === "disconnected") {
                            falhaCritica("Conexão P2P perdida (tempo limite excedido).");
                        }
                    }, 10000);
                }
            } else if (["failed", "closed"].includes(state)) {
                clearTimeout(iceDisconnectTimer);
                if (!isAborted && !transferenciaConcluida && !eofRecebido) {
                    const msgErro = (!dataChannel || dataChannel.readyState !== 'open')
                        ? "Falha ao fechar conexão direta (rede com NAT restrito ou firewall)."
                        : "Conexão P2P interrompida.";
                    falhaCritica(msgErro);
                }
            }
        };

        if (role === "sender") {
            dataChannel = peerConnection.createDataChannel("fileTransfer", { ordered: true });
            dataChannel.binaryType = "arraybuffer";
            dataChannel.bufferedAmountLowThreshold = 256 * 1024;
            dataChannel.onopen = () => {
                if (isAborted || !selectedFile) return;
                document.getElementById('progressTitle').innerText = "Aguardando Aceite";
                document.getElementById('statusLabel').innerText = "Aguardando o destinatário aceitar o arquivo...";
                try {
                    sendChannelData(JSON.stringify({
                        type: "meta",
                        name: selectedFile.name,
                        size: selectedFile.size
                    }));
                } catch (err) {
                    falhaCritica("Falha ao enviar metadados do arquivo.");
                }
            };
            dataChannel.onmessage = (e) => {
                if (isAborted || typeof e.data !== "string") return;
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === "meta_ack") {
                        transmitirArquivo();
                    }
                } catch (err) {}
            };
            dataChannel.onclose = () => {
                if (!isAborted && !transferenciaConcluida) {
                    falhaCritica("Conexão encerrada pelo destinatário.");
                }
            };
            dataChannel.onerror = () => {
                if (!isAborted && !transferenciaConcluida) {
                    falhaCritica("Erro no canal de transmissão P2P.");
                }
            };
        } else {
            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                dataChannel.binaryType = "arraybuffer";
                dataChannel.bufferedAmountLowThreshold = 256 * 1024;
                dataChannel.onclose = () => {
                    if (!isAborted && !transferenciaConcluida && !eofRecebido) {
                        falhaCritica("Remetente encerrou a conexão.");
                    }
                };
                dataChannel.onerror = () => {
                    if (!isAborted && !transferenciaConcluida && !eofRecebido) {
                        falhaCritica("Erro no canal de recebimento P2P.");
                    }
                };
                configurarRecebimento();
            };
        }
    }

    function iniciarHandshake() {
        document.getElementById('statusLabel').innerText = "Negociando conexão direta P2P...";
        peerConnection.createOffer()
            .then(offer => peerConnection.setLocalDescription(offer))
            .then(() => enviarSinal({ sdp: peerConnection.localDescription }))
            .catch(() => falhaCritica("Falha ao gerar oferta P2P."));
    }

    function enviarSinal(dados) {
        dados.senderId = myClientId;
        if (db && roomId) {
            db.ref(`p2p_rooms/${roomId}`).push(dados);
        }
    }

    async function transmitirArquivo() {
        if (isAborted || !selectedFile) return;

        const label = document.getElementById('statusLabel');
        const bar = document.getElementById('progressBar');
        document.getElementById('progressTitle').innerText = "Enviando Arquivo";
        label.style.color = "var(--text-muted)";
        label.innerText = "Iniciando transferência...";
        bar.style.width = "0%";
        transferStartTime = Date.now();
        let lastUiUpdate = 0;

        let offset = 0;
        const SAFE_BUFFER_LIMIT = 512 * 1024;

        try {
            while (offset < selectedFile.size) {
                if (isAborted || !dataChannel || dataChannel.readyState !== 'open') {
                    throw new Error("Canal de transmissão indisponível.");
                }

                if (dataChannel.bufferedAmount > SAFE_BUFFER_LIMIT) {
                    await new Promise((resolve, reject) => {
                        let liberado = false;
                        const concluir = (erro) => {
                            if (liberado) return;
                            liberado = true;
                            if (dataChannel) dataChannel.onbufferedamountlow = null;
                            clearTimeout(limite);
                            if (erro) reject(erro);
                            else resolve();
                        };
                        const limite = setTimeout(() => {
                            if (isAborted || !dataChannel || dataChannel.readyState !== 'open') {
                                concluir(new Error("Canal fechado durante espera do buffer."));
                            } else {
                                concluir();
                            }
                        }, 4000);
                        dataChannel.onbufferedamountlow = () => concluir();
                    });
                }

                if (isAborted) return;

                const slice = selectedFile.slice(offset, offset + CHUNK_SIZE);
                const buffer = await slice.arrayBuffer();
                sendChannelData(buffer);
                offset = Math.min(offset + CHUNK_SIZE, selectedFile.size);

                const now = Date.now();
                if (now - lastUiUpdate >= 80 || offset === selectedFile.size) {
                    lastUiUpdate = now;
                    const percent = selectedFile.size > 0 ? Math.min((offset / selectedFile.size) * 100, 100) : 100;
                    const elapsedSec = Math.max((now - transferStartTime) / 1000, 0.1);
                    const speedText = formatBytes(offset / elapsedSec);
                    bar.style.width = `${percent}%`;
                    label.innerText = `${Math.round(percent)}% (${formatBytes(offset)} de ${formatBytes(selectedFile.size)}) • ${speedText}/s`;
                }
            }

            sendChannelData(JSON.stringify({ type: "eof" }));
            bar.style.width = "100%";
            transferenciaConcluida = true;
            document.getElementById('progressTitle').innerText = "Envio Concluído! 🎉";
            label.style.color = "var(--success)";
            label.innerText = `Arquivo entregue com sucesso (${formatBytes(selectedFile.size)}).`;

            const btnCancel = document.getElementById('btnCancel');
            btnCancel.innerText = "Voltar ao Início";
            btnCancel.classList.remove("btn-danger");

            limparSalaFirebase();
        } catch (err) {
            if (!isAborted && !transferenciaConcluida) {
                falhaCritica("Transferência interrompida: conexão perdida.");
            }
        }
    }

    function configurarRecebimento() {
        let lastUiUpdate = 0;

        dataChannel.onmessage = (e) => {
            if (isAborted) return;

            if (typeof e.data === "string") {
                let msg;
                try {
                    msg = JSON.parse(e.data);
                } catch (err) {
                    return;
                }

                if (msg.type === "meta") {
                    const validSize = typeof msg.size === 'number' && Number.isFinite(msg.size) && msg.size >= 0;
                    if (!validSize) {
                        falhaCritica("Metadados de arquivo inválidos.");
                        return;
                    }
                    metaData = {
                        type: "meta",
                        name: sanitizeFileName(msg.name),
                        size: msg.size
                    };
                    writeQueue = Promise.resolve();
                    metaAckSent = false;
                    eofRecebido = false;
                    receivedChunks = [];
                    receivedSize = 0;
                    lastUiUpdate = 0;

                    const bar = document.getElementById('progressBar');
                    bar.classList.remove('connecting');
                    bar.style.width = "0%";

                    document.getElementById('fileMeta').style.display = "block";
                    document.getElementById('fileMeta').innerText = `${metaData.name} (${formatBytes(metaData.size)})`;

                    const enviarAck = () => {
                        if (metaAckSent || isAborted) return;
                        metaAckSent = true;
                        transferStartTime = Date.now();
                        document.getElementById('progressTitle').innerText = "Recebendo Arquivo";
                        try {
                            sendChannelData(JSON.stringify({ type: "meta_ack" }));
                        } catch (err) {
                            falhaCritica("Falha ao confirmar início do recebimento.");
                        }
                    };

                    // Se suportado no desktop, solicita clique do usuário para liberar showSaveFilePicker
                    if (window.showSaveFilePicker && window.isSecureContext) {
                        const acceptBtn = document.getElementById('acceptBtn');
                        acceptBtn.innerText = "Aceitar e Salvar Arquivo";
                        document.getElementById('progressTitle').innerText = "Arquivo Pronto";
                        document.getElementById('statusLabel').style.color = "var(--text-muted)";
                        document.getElementById('statusLabel').innerText = "Clique abaixo para escolher onde salvar e iniciar:";
                        acceptBtn.classList.remove('hidden');
                        acceptBtn.onclick = async () => {
                            acceptBtn.classList.add('hidden');
                            try {
                                const handle = await window.showSaveFilePicker({ suggestedName: metaData.name });
                                fileWritableStream = await handle.createWritable();
                                document.getElementById('statusLabel').style.color = "var(--text-muted)";
                                document.getElementById('statusLabel').innerText = "Stream direta em disco ativada...";
                                enviarAck();
                            } catch (err) {
                                fileWritableStream = null;
                                if (err && err.name === 'AbortError') {
                                    document.getElementById('progressTitle').innerText = "Arquivo Pronto";
                                    document.getElementById('statusLabel').style.color = "var(--warning)";
                                    document.getElementById('statusLabel').innerText = "Seleção de arquivo cancelada. Escolha onde salvar para iniciar:";
                                    acceptBtn.classList.remove('hidden');
                                    return;
                                }
                                if (metaData.size > MAX_RAM_AUTO_BYTES) {
                                    acceptBtn.innerText = `Baixar em RAM Mesmo Assim (${formatBytes(metaData.size)})`;
                                    document.getElementById('progressTitle').innerText = "Arquivo Grande Detectado";
                                    document.getElementById('statusLabel').style.color = "var(--warning)";
                                    document.getElementById('statusLabel').innerText = "Stream em disco indisponível. Este arquivo usará memória RAM antes do download.";
                                    acceptBtn.classList.remove('hidden');
                                    acceptBtn.onclick = () => {
                                        acceptBtn.classList.add('hidden');
                                        document.getElementById('statusLabel').style.color = "var(--text-muted)";
                                        document.getElementById('statusLabel').innerText = "Baixando fluxo direto...";
                                        enviarAck();
                                    };
                                    return;
                                }
                                document.getElementById('statusLabel').style.color = "var(--text-muted)";
                                document.getElementById('statusLabel').innerText = "Salvamento em memória ativado...";
                                enviarAck();
                            }
                        };
                    } else if (metaData.size > MAX_RAM_AUTO_BYTES) {
                        const acceptBtn = document.getElementById('acceptBtn');
                        acceptBtn.innerText = `Baixar Mesmo Assim (${formatBytes(metaData.size)})`;
                        document.getElementById('progressTitle').innerText = "Arquivo Grande Detectado";
                        document.getElementById('statusLabel').style.color = "var(--warning)";
                        document.getElementById('statusLabel').innerText = "Este navegador salvará o arquivo na memória RAM antes do download.";
                        acceptBtn.classList.remove('hidden');
                        acceptBtn.onclick = () => {
                            acceptBtn.classList.add('hidden');
                            document.getElementById('statusLabel').style.color = "var(--text-muted)";
                            document.getElementById('statusLabel').innerText = "Baixando fluxo direto...";
                            enviarAck();
                        };
                    } else {
                        document.getElementById('statusLabel').style.color = "var(--text-muted)";
                        document.getElementById('statusLabel').innerText = "Baixando fluxo direto...";
                        enviarAck();
                    }
                } else if (msg.type === "eof") {
                    eofRecebido = true;
                    writeQueue = writeQueue.then(async () => {
                        if (isAborted) return;
                        if (receivedSize !== metaData.size) {
                            throw new Error("Transferência incompleta: tamanho do arquivo não confere.");
                        }
                        if (fileWritableStream) {
                            await fileWritableStream.close();
                            fileWritableStream = null;
                            document.getElementById('statusLabel').innerText = `Salvo diretamente no seu dispositivo (${formatBytes(metaData.size)}).`;
                        } else {
                            document.getElementById('statusLabel').innerText = `Arquivo pronto para download (${formatBytes(metaData.size)})!`;
                            if (activeDownloadUrl) {
                                try { URL.revokeObjectURL(activeDownloadUrl); } catch(e){}
                            }
                            const blob = new Blob(receivedChunks, { type: "application/octet-stream" });
                            receivedChunks = [];
                            activeDownloadUrl = URL.createObjectURL(blob);
                            const btn = document.getElementById('downloadBtn');

                            btn.classList.remove('hidden');
                            btn.onclick = () => {
                                const a = document.createElement('a');
                                a.href = activeDownloadUrl;
                                a.download = metaData.name;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                            };
                        }

                        transferenciaConcluida = true;
                        document.getElementById('progressBar').style.width = "100%";
                        document.getElementById('progressTitle').innerText = "Download Concluído! 🎉";
                        document.getElementById('statusLabel').style.color = "var(--success)";

                        const btnCancel = document.getElementById('btnCancel');
                        btnCancel.innerText = "Voltar ao Início";
                        btnCancel.classList.remove("btn-danger");

                        limparSalaFirebase();
                    }).catch((err) => {
                        falhaCritica(err && err.message ? err.message : "Erro ao finalizar a gravação do arquivo.");
                    });
                }
            } else {
                if (!metaData || isAborted || eofRecebido || transferenciaConcluida) return;
                const chunkData = e.data;
                const byteLen = chunkData instanceof ArrayBuffer ? chunkData.byteLength : (chunkData && typeof chunkData.size === 'number' ? chunkData.size : 0);
                if (byteLen <= 0) return;

                writeQueue = writeQueue.then(async () => {
                    if (isAborted) return;
                    if (receivedSize + byteLen > metaData.size) {
                        throw new Error("Tamanho recebido excedeu os metadados declarados.");
                    }
                    if (fileWritableStream) {
                        await fileWritableStream.write(chunkData);
                    } else {
                        receivedChunks.push(chunkData);
                    }

                    receivedSize += byteLen;
                    const now = Date.now();
                    if (now - lastUiUpdate >= 80 || receivedSize === metaData.size) {
                        lastUiUpdate = now;
                        const percent = metaData.size > 0 ? Math.min((receivedSize / metaData.size) * 100, 100) : 100;
                        const elapsedSec = Math.max((now - transferStartTime) / 1000, 0.1);
                        const speedText = formatBytes(receivedSize / elapsedSec);
                        document.getElementById('progressBar').style.width = `${percent}%`;
                        document.getElementById('statusLabel').innerText = `${Math.round(percent)}% (${formatBytes(receivedSize)} de ${formatBytes(metaData.size)}) • ${speedText}/s`;
                    }
                }).catch((err) => {
                    falhaCritica(err && err.message && err.message.includes("excedeu") ? err.message : "Sem espaço ou permissão para salvar no disco.");
                });
            }
        };
    }

    function falhaCritica(motivo) {
        if (isAborted) return;
        isAborted = true;
        clearTimeout(signalWatchdog);
        clearTimeout(iceDisconnectTimer);
        pendingCandidates = [];
        receivedChunks = [];

        if (fileWritableStream) {
            try { fileWritableStream.abort ? fileWritableStream.abort() : fileWritableStream.close(); } catch(e){}
            fileWritableStream = null;
        }

        limparSalaFirebase();

        const acceptBtn = document.getElementById('acceptBtn');
        if (acceptBtn) acceptBtn.classList.add('hidden');

        const titulo = document.getElementById('progressTitle');
        const label = document.getElementById('statusLabel');
        const bar = document.getElementById('progressBar');
        if (titulo) {
            titulo.innerText = "Falha na transferência";
            titulo.style.color = "var(--danger)";
        }
        if (label) {
            label.innerText = motivo;
            label.style.color = "var(--danger)";
            label.style.fontWeight = "600";
        }
        if (bar) {
            bar.classList.remove('connecting');
            bar.style.width = "100%";
            bar.style.background = "var(--danger)";
        }
        const btn = document.getElementById('btnCancel');
        if (btn) {
            btn.innerText = "Voltar ao Início";
            btn.classList.remove('btn-danger');
            btn.classList.add('btn');
        }
    }

    function voltarAoInicio() {
        isAborted = true;
        clearTimeout(signalWatchdog);
        clearTimeout(iceDisconnectTimer);
        pendingCandidates = [];
        receivedChunks = [];
        if (activeDownloadUrl) { try { URL.revokeObjectURL(activeDownloadUrl); } catch(e){} activeDownloadUrl = null; }
        if (fileWritableStream) { try { fileWritableStream.abort ? fileWritableStream.abort() : fileWritableStream.close(); } catch(e){} fileWritableStream = null; }
        if (dataChannel) { try { dataChannel.close(); } catch(e){} }
        if (peerConnection) { try { peerConnection.close(); } catch(e){} }
        limparSalaFirebase();

        window.location.href = window.location.pathname;
    }

    window.addEventListener('beforeunload', (e) => {
        if (handshakeStarted && !transferenciaConcluida && !isAborted) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    window.addEventListener('pagehide', () => {
        if (!transferenciaConcluida && role === 'sender') {
            limparSalaFirebase();
        }
    });

    document.getElementById('btnCancel').onclick = voltarAoInicio;
</script>
