<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo PnP | Eduardo Borsari</title>
    <meta name="description" content="Biblioteca pessoal de jogos print-and-play, indexada do Google Drive.">
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        zinc: {
                            850: '#1f1f22',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #050505; 
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        
        .card-jogo { transition: all 0.3s ease; }
        .card-jogo:hover { transform: translateY(-5px); border-color: #52525b; }

        .capa-container { position: relative; overflow: hidden; }
        .capa-jogo { 
            filter: grayscale(100%) contrast(110%); 
            transition: all 0.5s ease; 
        }
        .card-jogo:hover .capa-jogo { 
            filter: grayscale(0%) contrast(100%); 
            transform: scale(1.05); 
        }
        
        .back-hub {
            display: inline-block; margin-bottom: 8px;
            font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
            color: #a1a1aa; text-decoration: none; border: 1px solid #3f3f46;
            padding: 5px 10px; border-radius: 999px; transition: color .2s, border-color .2s;
        }
        .back-hub:hover { color: #fff; border-color: #fff; }

        .badge-type {
            backdrop-filter: blur(4px);
            background: rgba(0,0,0,0.7);
        }
    </style>
</head>
<body class="text-zinc-300 min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <a href="/" class="back-hub">&larr; Acervo</a>
                <h1 class="text-xl font-bold tracking-tighter text-white uppercase font-mono border-l-4 border-white pl-3">
                    Acervo <span class="text-zinc-500">PnP</span>
                </h1>
            </div>
            
            <div class="relative w-full md:w-96">
                <input type="text" id="input-busca" placeholder="BUSCAR ARQUIVO..." 
                    class="w-full bg-zinc-900/50 border border-zinc-700 text-zinc-300 text-sm rounded-sm focus:border-white block w-full pl-4 p-2.5 placeholder-zinc-600 font-mono transition-all focus:bg-black">
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto p-6 w-full mt-8">
        
        <div class="flex justify-between items-end mb-8 border-b border-zinc-800 pb-4">
            <div>
                <h2 class="text-3xl font-bold text-white tracking-tight">Arquivos</h2>
                <p class="text-sm text-zinc-500 mt-1 font-mono">Status: <span class="text-emerald-500">ONLINE</span></p>
            </div>
        </div>

        <div id="lista-jogos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-20">
                <div class="inline-block w-8 h-8 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                <p class="mt-4 text-zinc-500 font-mono text-sm">Carregando acervo...</p>
            </div>
        </div>

        <div id="status-msg" class="text-center mt-10 hidden">
            <p class="text-zinc-500 font-mono text-sm border border-dashed border-zinc-800 inline-block px-4 py-2 rounded">
                Nenhum arquivo encontrado.
            </p>
        </div>
    </main>

    <footer class="mt-auto border-t border-zinc-800 bg-zinc-950 pt-10 pb-8">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <div class="flex flex-col md:flex-row items-center justify-center gap-8 bg-zinc-900/50 p-6 rounded-xl border border-zinc-800 mb-8">
                <div class="bg-white p-2 rounded shadow-lg shrink-0">
                    <div id="pix-qrcode" class="w-40 h-40 flex items-center justify-center"></div>
                </div>
                <div class="w-full max-w-sm">
                    <input type="text" id="pix-input" readonly value="00020126580014br.gov.bcb.pix0136ba5803b1-d408-48c6-bf5d-62509ff76cf35204000053039865802BR5925EDUARDO GONCALVES BORSARI6014RIO DE JANEIRO62070503***6304D5A8" class="sr-only">
                    <button onclick="copiarPix()" id="btn-copy" class="w-full bg-white text-black hover:bg-zinc-200 font-bold py-3 px-4 rounded text-xs uppercase tracking-widest transition-all">
                        Copiar Chave Pix
                    </button>
                    <span id="btn-text" class="block mt-2 text-[10px] text-zinc-500 font-mono">Clique para copiar</span>
                </div>
            </div>
            <p class="text-zinc-600 text-[10px] font-mono uppercase">Acervo PnP © 2026</p>
        </div>
    </footer>

    <script>
                // CONFIGURAÇÕES
        const API_KEY = 'AIzaSyCLscTYHULt_5Ai0ZqLCJclW05tD2B6pnc';
        const FOLDER_ID = '1sZZgnW_XaNiyKSzhYatP3AXClPaI2rjW';

        let todosOsJogos = [];
        let todasAsCapas = [];

        // FUNÇÕES AUXILIARES
        function esc(t) {
            return String(t == null ? '' : t)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizarTexto(t) {
            return String(t == null ? '' : t)
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');
        }

        function extrairNome(nome) {
            return String(nome).replace(/\.[^/.]+$/, '').replace(/_/g, ' ');
        }

        function getFileIcon(mime, name) {
            const m = String(mime || '');
            if (m.includes('pdf') || /\.pdf$/i.test(name)) return 'PDF';
            if (m.includes('zip') || /\.(zip|rar|7z)$/i.test(name)) return 'ZIP';
            return 'ARQ';
        }

        // Link direto de download (o webViewLink abre a pré-visualização, não baixa)
        function linkDownload(jogo) {
            if (jogo.id) return 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(jogo.id);
            return jogo.webViewLink || '#';
        }

        function tamanhoLegivel(bytes) {
            const n = Number(bytes);
            if (!n || isNaN(n)) return '';
            if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
            if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
            return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        const CAPA_PADRAO = 'https://placehold.co/400x600/1a1a1a/333?text=';

        // RENDERIZAÇÃO
        function renderizar(lista) {
            const container = document.getElementById('lista-jogos');
            const statusMsg = document.getElementById('status-msg');
            container.innerHTML = '';

            if (lista.length === 0) {
                statusMsg.classList.remove('hidden');
                return;
            }
            statusMsg.classList.add('hidden');

            lista.forEach((jogo) => {
                const nomeBase = extrairNome(jogo.name);
                const capaDrive = todasAsCapas.find(c => extrairNome(c.name) === nomeBase);
                const fallback = CAPA_PADRAO + encodeURIComponent(nomeBase.slice(0, 28)) + '&font=roboto';

                let imgUrl = fallback;
                if (capaDrive && capaDrive.thumbnailLink) imgUrl = capaDrive.thumbnailLink.replace('s220', 's800');
                else if (jogo.thumbnailLink && !/\.(zip|rar|7z)$/i.test(jogo.name)) imgUrl = jogo.thumbnailLink.replace('s220', 's800');

                const tamanho = tamanhoLegivel(jogo.size);

                const card = document.createElement('div');
                card.className = 'card-jogo group relative bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden flex flex-col h-full';
                card.innerHTML = `
                    <div class="capa-container h-64 w-full bg-black relative">
                        <span class="absolute top-2 right-2 badge-type text-[10px] text-white font-mono px-2 py-1 rounded border border-white/20 z-10">
                            ${esc(getFileIcon(jogo.mimeType, jogo.name))}
                        </span>
                        <img src="${esc(imgUrl)}" class="capa-jogo w-full h-full object-cover" alt="${esc(nomeBase)}" loading="lazy">
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="text-sm font-bold text-white mb-1 line-clamp-2 uppercase">${esc(nomeBase)}</h3>
                        <p class="text-[10px] text-zinc-500 font-mono mb-4 h-4">${esc(tamanho)}</p>
                        <a href="${esc(linkDownload(jogo))}" target="_blank" rel="noopener noreferrer"
                           class="mt-auto block w-full bg-white text-black hover:bg-zinc-200 py-2 text-center text-[10px] font-black uppercase rounded-sm">
                            Download
                        </a>
                    </div>
                `;
                container.appendChild(card);

                const img = card.querySelector('img');
                img.addEventListener('error', () => {
                    if (img.src !== fallback) img.src = fallback;
                }, { once: true });
            });
        }

        // CARREGAMENTO INICIAL (paginado: sem isso a API corta em 100 arquivos)
        async function listarArquivos() {
            const arquivos = [];
            let pageToken = '';

            do {
                const params = new URLSearchParams({
                    q: `'${FOLDER_ID}' in parents and trashed=false`,
                    fields: 'nextPageToken,files(id,name,webViewLink,thumbnailLink,mimeType,size)',
                    pageSize: '1000',
                    key: API_KEY
                });
                if (pageToken) params.set('pageToken', pageToken);

                const response = await fetch('https://www.googleapis.com/drive/v3/files?' + params.toString());
                const data = await response.json();

                if (data.error) throw new Error(data.error.message || 'A API do Drive recusou a requisição');
                (data.files || []).forEach(f => arquivos.push(f));
                pageToken = data.nextPageToken || '';
            } while (pageToken);

            return arquivos;
        }

        async function carregarJogos() {
            const container = document.getElementById('lista-jogos');
            try {
                const files = await listarArquivos();
                todosOsJogos = files.filter(f => !String(f.mimeType).includes('image') && !String(f.mimeType).includes('folder'));
                todasAsCapas = files.filter(f => String(f.mimeType).includes('image'));
                renderizar(todosOsJogos);
            } catch (error) {
                console.error(error);
                container.innerHTML = '<p class="col-span-full text-center text-red-500 font-mono text-sm py-16">Erro ao carregar o acervo: ' + esc(error.message) + '</p>';
            }
        }

        // PIX — QR gerado no próprio navegador (antes ia para api.qrserver.com, um terceiro)
        function iniciarPix() {
            const input = document.getElementById('pix-input');
            const alvo = document.getElementById('pix-qrcode');
            if (!input || !alvo) return;
            const codigo = input.value.trim();
            if (!codigo) return;
            if (typeof QRCode === 'undefined') {
                alvo.innerHTML = '<span class="text-[9px] text-zinc-500 text-center px-1">QR indisponível — use o botão ao lado</span>';
                return;
            }
            alvo.innerHTML = '';
            new QRCode(alvo, {
                text: codigo,
                width: 160,
                height: 160,
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function copiaLegacy(texto, aoCopiar) {
            const ta = document.createElement('textarea');
            ta.value = texto;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            ta.setSelectionRange(0, 99999);
            let copiou = false;
            try { copiou = document.execCommand('copy'); } catch (e) { copiou = false; }
            document.body.removeChild(ta);
            if (copiou) aoCopiar();
        }

        function copiarPix() {
            const input = document.getElementById('pix-input');
            const btn = document.getElementById('btn-copy');
            const texto = input.value.trim();
            if (!texto) return;

            const aoCopiar = () => {
                btn.innerText = 'COPIADO!';
                setTimeout(() => { btn.innerText = 'COPIAR CHAVE PIX'; }, 2000);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(texto).then(aoCopiar).catch(() => copiaLegacy(texto, aoCopiar));
            } else {
                copiaLegacy(texto, aoCopiar);
            }
        }

        // EVENTOS
        document.getElementById('input-busca').addEventListener('input', (e) => {
            const termo = normalizarTexto(e.target.value.trim());
            if (!termo) return renderizar(todosOsJogos);
            renderizar(todosOsJogos.filter(j => normalizarTexto(j.name).includes(termo)));
        });

        // INICIAR
        iniciarPix();
        carregarJogos();
    </script>
</body>
</html>
